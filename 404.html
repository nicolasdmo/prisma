<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — PRISMA</title>
  <meta name="robots" content="noindex">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/global.css">

  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .nf-glow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 40% at 50% 30%, rgba(124,106,255,0.25) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 70% 70%, rgba(168,85,247,0.15) 0%, transparent 60%);
      pointer-events: none;
    }
    .nf-diamond {
      font-size: 4rem;
      margin-bottom: 8px;
      animation: nf-spin 8s linear infinite;
    }
    @keyframes nf-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .nf-code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.05em;
    }
    .nf-wrap h1 {
      font-size: clamp(1.4rem, 4vw, 2rem);
      margin: 16px 0 12px;
    }
    .nf-wrap p {
      color: var(--color-muted);
      max-width: 420px;
      margin: 0 auto 32px;
    }
    @media (prefers-reduced-motion: reduce) {
      .nf-diamond { animation: none; }
    }
  </style>
</head>
<body>

  <div class="nf-wrap">
    <div class="nf-glow"></div>

    <div class="nf-diamond">◈</div>
    <div class="nf-code gradient-text">404</div>
    <h1>Esta página se perdió en el prisma</h1>
    <p>
      El link que seguiste no existe o se movió. Pero tu arquetipo todavía
      te espera del otro lado.
    </p>

    <a href="/index.html" class="btn-primary">
      <span>Hacer el test</span>
      <span>→</span>
    </a>
  </div>

</body>
</html>
